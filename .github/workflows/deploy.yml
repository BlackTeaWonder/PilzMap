name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'landingpage/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Seite zusammenstellen (App + Landingpage)
        run: |
          mkdir -p _site/landingpage
          cp -r www/. _site/
          cp landingpage/index.html _site/landingpage/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - id: deployment
        uses: actions/deploy-pages@v4
